[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracescholar"
version = "0.1.0"
description = "An evidence-first scientific literature research agent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "TraceScholar contributors" },
]
keywords = ["agent", "literature-review", "research", "scientific-papers"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
tracescholar = "tracescholar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
