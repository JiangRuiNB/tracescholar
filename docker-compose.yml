services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tracescholar
      POSTGRES_USER: tracescholar
      POSTGRES_PASSWORD: tracescholar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tracescholar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracescholar -d tracescholar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tracescholar_postgres_data:
